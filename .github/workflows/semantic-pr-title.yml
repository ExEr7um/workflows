name: Семантический заголовок PR

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
        description: Метка раннера, на котором выполняются задачи, например `self-hosted`

permissions:
  pull-requests: read

jobs:
  validate:
    name: Семантический заголовок PR
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
