name: Тестирование

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
        description: Метка раннера, на котором выполняются задачи, например `self-hosted`

jobs:
  test:
    name: Тестирование
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Настройка Bun
        uses: oven-sh/setup-bun@v2

      - name: Установка зависимостей
        run: bun install

      - name: Тестирование
        run: bun run test
