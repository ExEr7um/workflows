name: Визуальные тесты

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
        description: Метка раннера, на котором выполняются задачи, например `self-hosted`. На раннере нужен Docker
      botClientId:
        type: string
        default: ""
        description: Client ID GitHub App, от имени которой пушатся эталоны. Ее ключ передается секретом `BOT_PRIVATE_KEY`
    secrets:
      BOT_PRIVATE_KEY:
        required: false
        description: Приватный ключ GitHub App из `botClientId`
      PUSH_TOKEN:
        required: false
        description: Personal access token для пуша эталонов, если GitHub App нет

jobs:
  test:
    name: Визуальные тесты
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      pull-requests: write
    env:
      UPDATE: ${{ github.event.label.name == 'update-screenshots' }}
    steps:
      - name: Снятие метки
        if: env.UPDATE == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          curl --fail --silent --show-error --output /dev/null --request DELETE \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR/labels/update-screenshots"

      - name: Токен GitHub App
        id: app-token
        if: env.UPDATE == 'true' && inputs.botClientId != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.botClientId }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      # Пуш через `GITHUB_TOKEN` не запускает workflow, и проверки PR на коммите с эталонами не появятся
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token || secrets.PUSH_TOKEN || github.token }}

      - name: Настройка Bun
        uses: oven-sh/setup-bun@v2

      - name: Установка зависимостей
        run: bun install

      # Рендеринг зависит от шрифтов и библиотек ОС, поэтому браузер берется из образа Playwright версии проекта.
      # Без `--user` файлы в рабочей папке self-hosted раннера остались бы у root
      - name: Тестирование
        id: test
        run: |
          PLAYWRIGHT_VERSION=$(bun --print 'require("playwright-core/package.json").version')
          docker run --rm --init --ipc=host \
            --user "$(id -u):$(id -g)" \
            --env CI --env GITHUB_ACTIONS --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            "mcr.microsoft.com/playwright:v$PLAYWRIGHT_VERSION-noble" \
            npm run test:visual -- --run ${{ env.UPDATE == 'true' && '--update' || '' }}

      - name: Загрузка отчета
        id: report
        if: failure() && env.UPDATE != 'true'
        uses: actions/upload-artifact@v7
        with:
          path: .vitest/index.html
          archive: false

      # Старый комментарий удаляется, а не правится, чтобы о новом падении пришло уведомление
      - name: Комментарий в PR
        if: ${{ !cancelled() && env.UPDATE != 'true' }}
        env:
          FAILED: ${{ steps.test.outcome == 'failure' }}
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          bun run - <<'EOF'
          const { FAILED, GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_TOKEN, PR, REPORT_URL } = process.env
          const api = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues`
          const headers = { Authorization: `Bearer ${GITHUB_TOKEN}` }
          const marker = "<!-- visual-test -->"

          const comments = await fetch(`${api}/${PR}/comments?per_page=100`, { headers }).then((response) => response.json())
          for (const { body, id } of comments) {
            if (body.startsWith(marker)) await fetch(`${api}/comments/${id}`, { headers, method: "DELETE" })
          }

          if (FAILED === "true") {
            const body = `${marker}
          **Визуальные тесты не прошли**

          [Отчет](${REPORT_URL}): эталон, текущий скриншот и отличия для каждой истории.
          Если внешний вид изменился намеренно, повесьте метку \`update-screenshots\`: эталоны обновятся и закоммитятся в ветку.`
            await fetch(`${api}/${PR}/comments`, { body: JSON.stringify({ body }), headers, method: "POST" })
          }
          EOF

      - name: Коммит эталонов
        if: env.UPDATE == 'true'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git add --all -- ':(glob)**/__screenshots__/**'
          if git diff --cached --quiet; then
            echo "::notice::Скриншоты совпадают с эталонами, обновлять нечего"
            exit 0
          fi

          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --message "test: Обновление эталонов скриншотов"
          git push origin "HEAD:refs/heads/$BRANCH" ||
            { echo "::error::Пока обновлялись эталоны, в ветку запушили новые коммиты. Повесьте метку еще раз"; exit 1; }
