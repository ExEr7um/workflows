name: Vite+

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
        description: Метка раннера, на котором выполняются задачи, например `self-hosted`

jobs:
  check:
    name: Vite+ check
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Настройка Vite+ и установка зависимостей
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-toolchain: true

      - name: Проверка
        run: vp check
