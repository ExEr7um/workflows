name: Vite+

on:
  workflow_call:
    inputs:
      cache-save:
        type: boolean
        default: true
        description: Требуется ли сохранение кеша зависимостей и тулчейна

jobs:
  check:
    name: Vite+ check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Настройка Vite+ и установка зависимостей
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-toolchain: true
          cache-save: ${{ inputs.cache-save }}

      - name: Проверка
        run: vp check
