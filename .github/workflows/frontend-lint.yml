name: Линт

on:
  workflow_call:
    inputs:
      eslint:
        type: boolean
        default: true
        description: Требуется ли проверка ESLint
      prettier:
        type: boolean
        default: true
        description: Требуется ли проверка Prettier

jobs:
  eslint:
    name: ESLint
    if: inputs.eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Настройка Bun
        uses: oven-sh/setup-bun@v2

      - name: Установка зависимостей
        run: bun install

      - name: ESLint
        run: bun --bun run eslint

  prettier:
    name: Prettier
    if: inputs.prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Настройка Bun
        uses: oven-sh/setup-bun@v2

      - name: Установка зависимостей
        run: bun install

      - name: Prettier
        run: bun run prettier
